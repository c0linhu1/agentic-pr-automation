  - name: blind-08
    validator: correctness
    note: "The credit is computed from elapsed_days (the part of the period already used) instead of the days remaining (period_end - today). A downgrade on the first day of the period gets no credit and one on the last day gets almost the full difference; the ticket asks for the unused part."
    expect: [logic, acceptance-criteria, data-integrity]
