  # Every other admin action records who did it; this one doesn't.
  - name: admin-delete-without-audit
    validator: compliance
    expect: [audit-trail]
    input: |
      TITLE: Let admins delete a customer

      CONTEXT (the changed files in full, after the change; for reading only):
      === src/Admin/AdminCustomersController.cs ===
      [Authorize(Roles = "Admin")]
      public class AdminCustomersController : Controller
      {
          private readonly ICustomerStore _customers;
          private readonly IAuditLog _audit;

          [HttpPost("admin/customers/{id:int}/suspend")]
          public async Task<IActionResult> Suspend(int id)
          {
              await _customers.SuspendAsync(id);
              await _audit.RecordAsync(User.Identity!.Name!, "customer.suspend", id);
              return Ok();
          }

          [HttpPost("admin/customers/{id:int}/email")]
          public async Task<IActionResult> ChangeEmail(int id, string email)
          {
              await _customers.ChangeEmailAsync(id, email);
              await _audit.RecordAsync(User.Identity!.Name!, "customer.email", id);
              return Ok();
          }

          [HttpDelete("admin/customers/{id:int}")]
          public async Task<IActionResult> Delete(int id)
          {
              await _customers.DeleteAsync(id);
              return NoContent();
          }
      }

      DIFF:
      --- a/src/Admin/AdminCustomersController.cs
      +++ b/src/Admin/AdminCustomersController.cs
      @@ -40,3 +40,10 @@ public class AdminCustomersController : Controller
      +
      +    [HttpDelete("admin/customers/{id:int}")]
      +    public async Task<IActionResult> Delete(int id)
      +    {
      +        await _customers.DeleteAsync(id);
      +        return NoContent();
      +    }

