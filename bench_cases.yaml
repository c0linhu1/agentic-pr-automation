  - name: reimplements-an-existing-helper
    validator: architecture
    expect: [duplication, consistency]
    input: |
      TITLE: Show totals on the receipt email

      CONTEXT (the changed files in full, after the change; for reading only):
      === src/emails/receipt.py ===
      from src.money import format_amount


      def render_order_line(item) -> str:
          return f"{item.quantity} x {item.name}: {format_amount(item.cents, item.currency)}"


      def render_receipt(order) -> str:
          def money(cents):
              return "$" + str(cents // 100) + "." + str(cents % 100).zfill(2)

          lines = [f"{item.name}: {money(item.cents)}" for item in order.items]
          lines.append(f"Total: {money(order.total_cents)}")
          return "\n".join(lines)

