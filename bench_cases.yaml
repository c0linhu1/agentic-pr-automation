    input: |
      TITLE: Download a statement as PDF
      DIFF:
      --- a/src/Web/Controllers/StatementsController.cs
      +++ b/src/Web/Controllers/StatementsController.cs
      @@ -18,4 +18,14 @@ public class StatementsController : Controller
           private readonly AppDbContext _db;
           private readonly IPdfRenderer _pdf;
      +
      +    [Authorize]
      +    [HttpGet("statements/{id:int}/pdf")]
      +    public async Task<IActionResult> Pdf(int id)
