# Benchmark cases for bench.py. Each planted case has one known bug; a validator "catches" it
# when it reports a finding in one of the `expect` categories (and, with `expect_words`, whose
# description or fix says one of those words; with a list of lists, one word from each; with
# `min_severity`, at that severity or worse). A case
# with no planted bug (`expect: []`) counts any finding more severe than `worst_allowed` (default:
# info, since any low finding already stops an auto-merge) as a false alarm. Add your own cases here.
#
# Keep the skills general: a case whose bug a skill describes by name measures whether the model
# repeats the hint. Cases marked "held out" are bugs no skill describes.

cases:
  - name: sql-injection
    validator: security
    expect: [injection]
    input: |
      TITLE: Add document search
      DIFF:
      --- a/api/search.py
      +++ b/api/search.py
      @@ -1,3 +1,8 @@
      +def search_documents(db, term):
      +    query = f"SELECT id, title FROM documents WHERE title LIKE '%{term}%'"
      +    return db.execute(query).fetchall()

  - name: divide-by-zero
    validator: correctness
    expect: [edge-case, logic]
    input: |
      TITLE: Add average order value
      DIFF:
      --- a/src/orders.py
      +++ b/src/orders.py
      @@ -10,3 +10,6 @@
      +def average_order_value(orders):
      +    total = sum(o.amount for o in orders)
      +    return total / len(orders)

