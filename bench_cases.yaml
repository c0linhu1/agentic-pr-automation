  # Clean but tricky: dates and weekdays that are all right (2028-04-13 is a Thursday).
  - name: clean-business-day-maths
    validator: correctness
    expect: []
    input: |
      TITLE: Settlement date is the next business day
      DESCRIPTION:
      Trades settle on the next business day: a Thursday trade (e.g. 2028-04-13) settles on Friday
      2028-04-14, and a Friday trade settles the following Monday. Holidays are out of scope (ticket 212).
      DIFF:
      --- a/src/Trading/Settlement.cs
      +++ b/src/Trading/Settlement.cs
      @@ -0,0 +1,14 @@
      +public static class Settlement
      +{
      +    public static DateOnly NextBusinessDay(DateOnly trade)
      +    {
      +        var next = trade.AddDays(1);
      +        while (next.DayOfWeek is DayOfWeek.Saturday or DayOfWeek.Sunday)
      +            next = next.AddDays(1);
      +        return next;
      +    }
      +}
      --- a/tests/Trading.Tests/SettlementTests.cs
      +++ b/tests/Trading.Tests/SettlementTests.cs
      @@ -0,0 +1,9 @@
      +public class SettlementTests
      +{
      +    [Theory]
      +    [InlineData("2028-04-13", "2028-04-14")]  // Thursday -> Friday
      +    [InlineData("2028-04-14", "2028-04-17")]  // Friday -> Monday
      +    public void Next_business_day(string trade, string expected) =>
      +        Assert.Equal(DateOnly.Parse(expected), Settlement.NextBusinessDay(DateOnly.Parse(trade)));
      +}

