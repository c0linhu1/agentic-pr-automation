  # Held out. Each billing date is a month after the last one, so a customer who signed up on the 31st
  # is billed on the 28th from February on and never goes back to the 31st.
  - name: billing-day-drifts-after-a-short-month
    validator: correctness
    expect: [logic, edge-case]
    expect_words: [[drift, "28th", "29th", "30th", "stays on", "stuck", "never goes back", "never returns",
                    "shifts", "creeps", "moves earlier", "every month after"],
                   ["31", "signup", "sign-up", "original day", "anchor", "short month", "february"]]
    input: |
      TITLE: Bill subscriptions monthly on the day the customer signed up
      DESCRIPTION:
      Each customer is billed on the same day of the month as their signup date, or the month's last day
      when that month is shorter.
      DIFF:
      --- a/billing/schedule.py
      +++ b/billing/schedule.py
      @@ -1,4 +1,11 @@
       from datetime import date
      +
      +from dateutil.relativedelta import relativedelta
      +
      +
      +def next_billing_date(last_billed: date) -> date:
      +    """The next date this subscription is billed: one month after the last bill."""
      +    return last_billed + relativedelta(months=1)
