           public void Refund(int orderId, decimal amount)
           {
               var order = _orders.Get(orderId);
      +        if (amount > order.Paid)
      +            throw new InvalidOperationException("Refund is larger than the amount paid.");
               _gateway.Refund(order.PaymentId, amount);
           }
      --- a/tests/Billing.Tests/RefundServiceTests.cs
      +++ b/tests/Billing.Tests/RefundServiceTests.cs
      @@ -30,3 +30,13 @@ public class RefundServiceTests
      +
      +    [Fact]
