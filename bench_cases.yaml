    input: |
      TITLE: Show the selected account's balance
      DIFF:
      --- a/web/src/BalanceCard.tsx
      +++ b/web/src/BalanceCard.tsx
      @@ -1,6 +1,14 @@
      -export function BalanceCard() {
      -  return <div className="card">Balance</div>;
      +export function BalanceCard({ accountId }: { accountId: string }) {
      +  const [balance, setBalance] = useState<number | null>(null);
      +
      +  useEffect(() => {
      +    setBalance(null);
      +    fetchBalance(accountId).then((b) => setBalance(b));
      +  }, [accountId]);
