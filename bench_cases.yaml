  # Held out. A refund is converted at today's exchange rate, not the rate the charge was made at, so
  # the customer gets back a different amount than they paid and the ledger no longer balances.
  - name: refund-at-todays-exchange-rate
    validator: correctness
    expect: [logic, data-integrity]
    expect_words: [[rate, exchange, fx], [today, current, "original", "at the time", "when the charge",
                                          "was charged", "charge's", "historical", "different amount", "changed since"]]
    input: |
      TITLE: Support refunds for charges made in other currencies
      DESCRIPTION:
      Customers can pay in EUR or GBP; we settle in USD. This adds refunds for those charges.
      DIFF:
      --- a/payments/refunds.py
      +++ b/payments/refunds.py
      @@ -1,9 +1,22 @@
       from dataclasses import dataclass
      +from payments import fx, gateway, ledger


       @dataclass
       class Charge:
           id: str
           currency: str         # what the customer paid in
           amount: int           # in that currency's minor units
           usd_amount: int       # what we settled, in cents
           fx_rate: float        # the rate used when the charge was made
      +
      +
      +def refund(charge: Charge, amount: int) -> int:
      +    """Refunds `amount` (in the charge's currency) and returns the USD cents refunded."""
      +    if amount > charge.amount:
      +        raise ValueError("refund is larger than the charge")
      +    usd = round(amount * fx.rate(charge.currency, "USD"))
      +    gateway.refund(charge.id, usd)
      +    ledger.post("refund", charge.id, -usd)
      +    return usd

  # Held out. Age from the year alone: anyone whose birthday hasn't come yet this year is a year too old,
  # so a 17-year-old can open an account.
  - name: age-from-the-year-only
    validator: correctness
    expect: [logic, edge-case]
    expect_words: [birthday, "not yet", "hasn't had", "has not had", "hasn't happened", "off by one", "one year too",
                   "a year too", "month and day", "later in the year", "17"]
    input: |
      TITLE: Block account opening for under-18s
      DESCRIPTION:
      Regulators require account holders to be 18 or older. Sign-up now checks the date of birth.
      DIFF:
      --- a/web/src/signup/age.ts
      +++ b/web/src/signup/age.ts
      @@ -0,0 +1,9 @@
      +export function ageOn(birthDate: Date, today: Date): number {
      +  return today.getFullYear() - birthDate.getFullYear();
      +}
      +
      +export const MINIMUM_AGE = 18;
      +
      +export function canOpenAccount(birthDate: Date, today = new Date()): boolean {
      +  return ageOn(birthDate, today) >= MINIMUM_AGE;
      +}

