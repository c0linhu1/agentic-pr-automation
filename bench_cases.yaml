  # Held out. A blur handler starts an async save; clicking Cancel blurs the field first, so the save
  # can land after the discard and bring the draft back.
  - name: blur-save-races-cancel
    validator: correctness
    expect: [concurrency, logic, data-integrity]
    expect_words: [[cancel, discard], [save, draft],
                   [blur, "loses focus", "lose focus", race, "comes back", reappear, resurrect, "out of order",
                    "in flight", "still pending", "after the delete", "after the discard", "after cancel"]]
    input: |
      TITLE: Autosave the note title, and let Cancel throw the draft away
      DESCRIPTION:
      The title is saved as a draft whenever the field loses focus. Cancel deletes the draft and closes
      the editor.
      DIFF:
      --- a/web/note-editor.ts
      +++ b/web/note-editor.ts
      @@ -8,5 +8,15 @@ export function initEditor(root: HTMLElement, noteId: string): void {
         const title = root.querySelector<HTMLInputElement>("#title")!;
         const cancel = root.querySelector<HTMLButtonElement>("#cancel")!;
      +
      +  title.addEventListener("blur", async () => {
      +    await api.put(`/notes/${noteId}/draft`, { title: title.value });
      +  });
      +
      +  cancel.addEventListener("click", async () => {
      +    await api.delete(`/notes/${noteId}/draft`);
      +    closeEditor();
      +  });
       }

