  # A change handler that resets a field fires when the field loses focus, which happens when the user
  # clicks the submit button: the reset lands just before the form is read, and the typed value is lost.
  - name: change-event-overwrites-input
    validator: correctness
    expect: [logic, edge-case, concurrency, data-integrity]
    # Judged on the reasoning, not on a hint's words: it must connect the reset to the submit.
    expect_words: [[submit, placeorder, "order is placed", "order goes out"],
                   [overwrit, reset, replac, lost, discard, clobber]]
    input: |
      TITLE: Reset quantity when switching between case and single-unit items
      DESCRIPTION:
      Quantity means cases for bulk items and single units otherwise. When the item type changes
      (picking an item from the list, or editing the SKU), quantity resets to that type's default:
      1 case or 12 units. The unit is shown next to the field.
      DIFF:
      --- a/web/order-form.ts
      +++ b/web/order-form.ts
      @@ -12,6 +12,14 @@ function init(form: HTMLFormElement): void {
         const quantity = field("quantity");
         const sku = field("sku");
      +  const unitLabel = form.querySelector<HTMLElement>("#quantity-unit")!;
      +
      +  let bulk = false;
      +  function setItemKind(isBulk: boolean): void {
      +    unitLabel.textContent = isBulk ? "(cases)" : "(units)";
      +    if (isBulk !== bulk) quantity.value = String(isBulk ? 1 : 12);
      +    bulk = isBulk;
      +  }
       
         function pick(item: string): void {
           sku.value = item;
      -    quantity.value = "1";
      +    setItemKind(isBulkSku(item));
         }
      @@ -30,6 +38,7 @@ function init(form: HTMLFormElement): void {
         for (const input of [sku, quantity]) input.addEventListener("input", scheduleTotal);
      +  sku.addEventListener("change", () => setItemKind(isBulkSku(sku.value)));
       
         form.addEventListener("submit", async (event) => {
           event.preventDefault();
           const order = await placeOrder({ sku: sku.value.trim(), quantity: Number(quantity.value) });

