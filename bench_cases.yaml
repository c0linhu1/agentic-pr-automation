  # Not held out: the data-integrity category mentions operations that are wrong if re-run. The provider
  # retries a webhook that fails, and the credit happens before the step that can fail, so one payment
  # can be credited several times.
  - name: webhook-credit-not-safe-to-retry
    validator: correctness
    expect: [data-integrity, logic, error-handling, concurrency]
    expect_words: [[retr, twice, "more than once", duplicate, idempot, replay, redeliver], [credit, wallet, balance, double]]
    input: |
      TITLE: Credit the wallet when a card payment succeeds
      DIFF:
      --- a/src/Payments/WebhooksController.cs
      +++ b/src/Payments/WebhooksController.cs
      @@ -14,3 +14,14 @@ public class WebhooksController : Controller
      +
      +    [HttpPost("webhooks/payments")]
      +    public async Task<IActionResult> Payment([FromBody] PaymentEvent e)
      +    {
      +        if (!_signature.IsValid(Request)) return Unauthorized();
      +        if (e.Type != "payment.succeeded") return Ok();
      +
      +        await _wallets.CreditAsync(e.AccountId, e.Amount);
      +        await _email.SendReceiptAsync(e.AccountId, e.Amount);
      +        return Ok();
      +    }

  # The other side of the TESTS rule: the repo tests this kind of code, so a bug fix with no
  # regression test is still high, not capped at medium.
  - name: bug-fix-without-test-where-tests-exist
    validator: qa
    expect: [missing-tests, untested-path]
    min_severity: high
    input: |
      TITLE: Fix proration when a plan is upgraded mid-month
      DESCRIPTION:
      Late-month upgrades gave a zero or negative charge, and December upgrades crashed, because the day
      count used the next month's length.
      TESTS: the repo's test files are 124 .py files (tests/billing, tests/api, tests/accounts).
      DIFF:
      --- a/src/billing/proration.py
      +++ b/src/billing/proration.py
      @@ -18,7 +18,8 @@ def prorated_charge(plan_price: Decimal, upgraded_on: date) -> Decimal:
      -    days_in_month = calendar.monthrange(upgraded_on.year, upgraded_on.month + 1)[1]
      +    days_in_month = calendar.monthrange(upgraded_on.year, upgraded_on.month)[1]
           days_left = days_in_month - upgraded_on.day + 1
           return (plan_price * days_left / days_in_month).quantize(Decimal("0.01"))

