  # Held out. Two withdrawals at once both read the balance before the await, so both pass the check.
  - name: check-then-await-then-write
    validator: correctness
    expect: [concurrency, data-integrity, logic]
    expect_words: [[concurren, race, "same time", simultaneous, interleav, "lost update", "two withdrawals"],
                   [balance, overdra, "lost update", negative, "more than", stale]]
    input: |
      TITLE: Write withdrawals to the audit log
      DIFF:
      --- a/wallet/service.py
      +++ b/wallet/service.py
      @@ -14,6 +14,7 @@ class Wallet:
           async def withdraw(self, account_id: str, amount: int) -> int:
               balance = self.balances[account_id]
               if balance < amount:
                   raise InsufficientFunds(account_id)
      +        await self.audit.record("withdraw", account_id, amount)
               self.balances[account_id] = balance - amount
               return balance - amount

