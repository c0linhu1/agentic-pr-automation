      +    }

  # Timing: the timer can fire at exactly 1000 ms, and isExpired needs strictly more.
  - name: test-depends-on-real-time
    validator: qa
    expect: [flaky]
    input: |
      TITLE: Expire sessions after their time to live
      DIFF:
      --- a/src/session.ts
      +++ b/src/session.ts
      @@ -0,0 +1,6 @@
      +export function createSession({ ttlMs }: { ttlMs: number }) {
      +  const created = Date.now();
      +  return {
      +    isExpired: () => Date.now() - created > ttlMs,
      +  };
      +}
      --- a/test/session.test.ts
      +++ b/test/session.test.ts
      @@ -0,0 +1,7 @@
      +import { createSession } from "../src/session";
      +
      +it("expires the session after its ttl", async () => {
      +  const session = createSession({ ttlMs: 1000 });
      +  await new Promise((resolve) => setTimeout(resolve, 1000));
      +  expect(session.isExpired()).toBe(true);
      +});

