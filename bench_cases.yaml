      count used the next month's length. Adds regression tests for both.
      TESTS: the repo's test files are 124 .py files (tests/billing, tests/api, tests/accounts).
      DIFF:
      --- a/src/billing/proration.py
      +++ b/src/billing/proration.py
      @@ -18,7 +18,8 @@ def prorated_charge(plan_price: Decimal, upgraded_on: date) -> Decimal:
      -    days_in_month = calendar.monthrange(upgraded_on.year, upgraded_on.month + 1)[1]
      +    days_in_month = calendar.monthrange(upgraded_on.year, upgraded_on.month)[1]
           days_left = days_in_month - upgraded_on.day + 1
           return (plan_price * days_left / days_in_month).quantize(Decimal("0.01"))
      --- a/tests/billing/test_proration.py
      +++ b/tests/billing/test_proration.py
      @@ -30,3 +30,11 @@ def test_upgrade_on_the_first_charges_the_full_month():
      +
      +def test_upgrade_on_the_31st_charges_one_day():
