# Models Vader may use (listed, enabled, and pulled).

default: qwen3.6:35b-a3b

# A validator can run on its own model; the rest use the active one. Uncomment to try, e.g.:
# validators:
#   architecture: gpt-oss:20b

models:
  - {name: llama3.2:3b, tier: test, enabled: true, note: "small and fast; for checking the pipeline, not for reviews"}
  - {name: gemma3:12b, tier: mid, enabled: true}
  - {name: gpt-oss:20b, tier: large, enabled: true, reasoning_effort: low, note: "reasoning model"}
  - {name: devstral:24b, tier: large, enabled: true}
  - {name: qwen3.6:35b-a3b, tier: large, enabled: true, temperature: 0.6, note: "Qwen's coding setting; near 0 it can think in circles"}
